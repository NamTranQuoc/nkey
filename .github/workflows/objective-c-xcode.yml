name: Build And Release DMG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: NKey
  PROJECT: NKey.xcodeproj
  SCHEME: NKey
  CONFIGURATION: Release
  VERSION_CONFIG: Config/Version.xcconfig

jobs:
  build-release:
    name: Build DMG and publish release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        run: |
          app_version=$(awk -F= '/^[[:space:]]*MARKETING_VERSION[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}' "$VERSION_CONFIG")
          build_number=$(awk -F= '/^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*=/{gsub(/[[:space:]]/, "", $2); print $2}' "$VERSION_CONFIG")

          if [ -z "$app_version" ]; then
            echo "MARKETING_VERSION is missing in $VERSION_CONFIG"
            exit 1
          fi

          if [ -z "$build_number" ]; then
            echo "CURRENT_PROJECT_VERSION is missing in $VERSION_CONFIG"
            exit 1
          fi

          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "TAG_NAME=v$app_version" >> "$GITHUB_ENV"
          echo "DMG_NAME=$APP_NAME-v$app_version.dmg" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          app_path="build/DerivedData/Build/Products/$CONFIGURATION/$APP_NAME.app"
          dmg_root="build/dmg-root"
          dmg_path="build/$DMG_NAME"

          if [ ! -d "$app_path" ]; then
            echo "App bundle not found at $app_path"
            exit 1
          fi

          codesign --force --deep --sign - "$app_path"

          rm -rf "$dmg_root" "$dmg_path"
          mkdir -p "$dmg_root"
          cp -R "$app_path" "$dmg_root/"

          hdiutil create \
            -volname "$APP_NAME $APP_VERSION" \
            -srcfolder "$dmg_root" \
            -ov \
            -format UDZO \
            "$dmg_path"

          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
            echo "GitHub immutable releases cannot accept new or replaced assets after creation."
            echo "Delete the existing release and tag, or bump MARKETING_VERSION in $VERSION_CONFIG, then rerun this workflow."
            exit 1
          fi

          gh release create "$TAG_NAME" "$DMG_PATH" \
            --title "$APP_NAME $APP_VERSION" \
            --notes "$APP_NAME $APP_VERSION"
